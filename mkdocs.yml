site_name: Frontend Engineering Notes
site_description: Личная база знаний Middle+/Senior Frontend: JavaScript, browser, React, async и алгоритмы
copyright: Copyright &copy; 2026

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Светлая тема

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Статьи:
      - Обзор: articles/index.md
      - JavaScript Core:
          - Обзор: articles/javascript-core/index.md
          - Execution context, scope и closures: articles/javascript-core/execution-context-scope-closures.md
          - this и call-site: articles/javascript-core/this-and-call-site.md
          - References, equality и immutability: articles/javascript-core/references-equality-immutability.md
      - Асинхронное программирование:
          - Обзор: articles/async/index.md
          - Event Loop: articles/async/event-loop.md
          - Promise и Promise API: articles/async/promises.md
          - async/await: articles/async/async-await.md
          - Паттерны timeout/retry/abort: articles/async/async-patterns.md
      - Браузер:
          - Обзор: articles/browser/index.md
          - Клик и переход на другую страницу: articles/browser/click-to-navigation.md
      - React теория:
          - Обзор: articles/react-theory/index.md
          - Virtual DOM и reconciliation: articles/react-theory/virtual-dom.md
          - Fiber: articles/react-theory/fiber.md
          - Render / Commit: articles/react-theory/rendering.md
          - State и source of truth: articles/react-theory/state-and-source-of-truth.md
          - Effects и синхронизация: articles/react-theory/effects-and-synchronization.md
          - Шпаргалка для собеса: articles/react-theory/interview-cheatsheet.md
      - React-задачи:
          - Обзор: articles/react-tasks/index.md
          - useDebouncedValue: articles/react-tasks/use-debounced-value.md
      - Интересные мини-задачи:
          - Обзор: articles/mini-tasks/index.md
          - Каррирование и carried: articles/mini-tasks/currying-and-carried.md
          - compose: articles/mini-tasks/compose.md
          - debounce: articles/mini-tasks/debounce.md
          - throttle: articles/mini-tasks/throttle.md
          - EventEmitter: articles/mini-tasks/event-emitter.md
      - Async-задачи:
          - Обзор: articles/async-tasks/index.md
          - retry с экспоненциальной задержкой: articles/async-tasks/retry-exponential-backoff.md
      - Алгоритмы:
          - Обзор: articles/algorithms/index.md
          - Подсчёт сложности: articles/algorithms/complexity.md
          - Хеш-таблицы: articles/algorithms/hash-tables.md
          - Префиксные суммы: articles/algorithms/prefix-sum.md
          - Битовые манипуляции: articles/algorithms/bit-manipulation.md
          - Два указателя: articles/algorithms/two-pointers.md
          - Скользящее окно: articles/algorithms/sliding-window.md
          - Бинарный поиск: articles/algorithms/binary-search.md
          - Сортировки: articles/algorithms/sorting.md
          - Интервалы: articles/algorithms/intervals.md
          - Матрицы: articles/algorithms/matrices.md
          - Связные списки: articles/algorithms/linked-lists.md
          - Деревья: articles/algorithms/trees.md
          - Стеки и очереди: articles/algorithms/stacks-queues.md
          - Поиск с возвратом: articles/algorithms/backtracking.md
          - Графы: articles/algorithms/graphs.md
          - Динамическое программирование: articles/algorithms/dynamic-programming.md

extra:
  generator: false
